<!DOCTYPE html>
<html lang="en">
<head>
    <title>Shengyao Care LTD Email Form</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Placeholder">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">

    <script src="js/main.js" defer></script>
</head>
<body>
    <header >
        <nav class="flexed">
            <section class="site-id">
                <h1 class="sr-only">This is hidden</h1>
                <h2><a href="/">Shengyao Care LTD</a></h2>
            </section>
            
            <button class="toggle-btn hamburger">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"  stroke-width="1.5"  stroke="currentColor" >
                    <title>Click to Toggle Menu</title>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 18h16M4 12h16M4 6h16"  />
                </svg>
            </button>
        </nav>
        <ul class="menu collapsed">
            <li><a href="emailForm.html">Email Us</a></li>
            <li><a href="attributions.html">Attributions</a></li>
        </ul>
    </header>

    <div class="form">

        <div>
            <section class="flexed">
                <h2 class="font-instrument font-semibold size-h2 text-black">Email Us!</h2>
                <p class="font-ubuntu font-regular size-p text-black">Fill out this form to send us an email</p>
            </section>
        
            <form class="column flexed" action="https://formspree.io/f/xyzvqrbz" method="POST" aria-roledescription="Contact">
                <div class="row">
                    <label class="font-ubuntu font-regular size-p text-black" for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="row">
                    <label class="font-ubuntu font-regular size-p text-black" for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="row">
                    <label class="font-ubuntu font-regular size-p text-black" for="telephone">Telephone:</label>
                    <input type="tel" id="telephone" name="telephone" pattern="^\(?([0-9]{3})\)?[-. ]?([0-9]{3})[-. ]?([0-9]{4})$" required>
                </div>
                <div class="row">
                    <label class="font-ubuntu font-regular size-p text-black" for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="row">
                    <label class="font-ubuntu font-regular size-p text-black" for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button class="font-ubuntu font-regular size-h2 text-black" type="submit">Send</button>
            </form>
        </div>

    </div>


    <footer>
        <section class="contact-us">
            <h2 class="font-instrument font-semibold size-h2 text-white">Contact Us!</h2>
            <ul class="font-ubuntu font-regular size-p text-white">
                <li>Phone: ??? ??? ????</li>
                <li>Email: ???</li>
            </ul>
            <a class="btn text-ubuntu font-semibold size-h2 text-black" href="emailForm.html">
                Email Us
                <img class="right-arrow flexed" src="img/right-arrow.svg" alt="right arrow">
            </a>
        </section>
    </footer>
</body>
</html>
